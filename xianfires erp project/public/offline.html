<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0c">
  <title>Offline · DJ's ERP Accounting</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0c; color: #f5f5f4; font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 26rem; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
    p { color: #a8a29e; margin: 0 0 1.25rem; }
    button { background: #facc15; color: #0b0b0c; border: 0; border-radius: .5rem; padding: .65rem 1.25rem; font-weight: 600; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/images/app/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>DJ's ERP Accounting needs a connection to the server so the books stay correct. Check your Wi-Fi or data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
