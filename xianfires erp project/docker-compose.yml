# DJ's ERP - Accounting with its own MySQL, in Docker.
#
#   docker compose up -d --build     build and start (first time: a few minutes)
#   docker compose ps                both services should be "healthy"
#   docker compose logs -f accounting
#   docker compose down              stop (data is kept in the volumes)
#   docker compose down -v           stop AND delete the database and uploaded files
#
# Open http://localhost:3000 (or DOCKER_APP_PORT). Settings below have demo defaults; put your own
# values in a file named ".env.docker" and run:  docker compose --env-file .env.docker up -d
name: djs-erp-accounting

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-djs-erp-root}
      MYSQL_DATABASE: xianfires_erp
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - db-data:/var/lib/mysql
      # Optional: .sql files here are loaded once, when the database is first created
      # (for example a dump of the real books, so the demo starts with data).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # 3307 on the laptop, so it never clashes with Laragon's MySQL on 3306.
      - "${DOCKER_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  accounting:
    build: .
    image: djs-erp-accounting:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: xianfires_erp
      DB_USER: root
      DB_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-djs-erp-root}
      SESSION_SECRET: ${DOCKER_SESSION_SECRET:-change-this-session-secret-for-production}
      ALLOW_SIGNUP: "false"
      # First administrator (made only when this login does not exist yet). Change the password after logging in.
      ADMIN_NAME: ${DOCKER_ADMIN_NAME:-CJ Mendoza}
      ADMIN_EMAIL: ${DOCKER_ADMIN_EMAIL:-admin@djs.local}
      ADMIN_PASSWORD: ${DOCKER_ADMIN_PASSWORD:-DjsErp#2026}
      # Links to the other DJ's ERP modules (optional; empty = this laptop).
      ERP_URL_POS: ${ERP_URL_POS:-}
      ERP_URL_HR: ${ERP_URL_HR:-}
      ERP_URL_SCM: ${ERP_URL_SCM:-}
      ERP_URL_CRM: ${ERP_URL_CRM:-}
      ERP_INTERNAL_KEY: ${ERP_INTERNAL_KEY:-}
    ports:
      - "${DOCKER_APP_PORT:-3000}:3000"
    volumes:
      # Receipts, backups and error logs survive container rebuilds.
      - storage:/app/storage

volumes:
  db-data:
  storage:
